name: checks
# Private repos get a monthly allowance of Actions minutes: test each change once (a pull request, then its
# merge to main), skip docs-only changes, and let a newer push to the same pull request cancel the older run.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the shared dependencies and both production targets
        run: |
          chmod -R go-rwx src cogs tests
          docker build -f ops/Dockerfile --target dependencies -t gene-dependencies:check .
          docker build -f ops/Dockerfile --target worker-dependencies -t gene-worker-dependencies:check .
          docker build -f ops/Dockerfile --target runtime --label org.opencontainers.image.revision=${{ github.sha }} -t gene-runtime:check .
          docker build -f ops/Dockerfile --target worker --label org.opencontainers.image.revision=${{ github.sha }} -t gene-worker:check .
      - name: Check the runtime and offline worker as UID 10001
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true gene-runtime:check python -c "import os, importlib.metadata, gene.api, gene.store, gene.runtime, gene.fri_release, gene.fri_reply_checks, gene.deploy, gene.provenance_downgrade, redbot; assert os.getuid() == 10001; assert importlib.metadata.version('Red-DiscordBot') == '3.5.24'"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,nosuid,size=512m -e HOME=/tmp -e PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 gene-worker:check python -m pytest -q -p no:cacheprovider tests/test_worker.py tests/test_repair_worker.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true gene-worker:check codex --version
          docker run --rm --network none --read-only --user 0 gene-worker:check python -c "from pathlib import Path; assert not Path('/root/.cache/uv').exists()"
      - name: Verify source-only rebuilds share the dependency layers
        run: |
          printf '\n# Source-only cache regression probe.\n' >> src/gene/api.py
          docker build -f ops/Dockerfile --target runtime --label org.opencontainers.image.revision=${{ github.sha }} -t gene-runtime:source-check .
          docker build -f ops/Dockerfile --target worker --label org.opencontainers.image.revision=${{ github.sha }} -t gene-worker:source-check .
          python3 - <<'PY'
          import json, subprocess
          def inspect(name):
              return json.loads(subprocess.check_output(['docker', 'image', 'inspect', name]))[0]
          dependencies = inspect('gene-dependencies:check')['RootFS']['Layers']
          worker_dependencies = inspect('gene-worker-dependencies:check')['RootFS']['Layers']
          layers = []
          for name in ('gene-runtime:check', 'gene-worker:check', 'gene-runtime:source-check', 'gene-worker:source-check'):
              image = inspect(name)
              assert image['Config']['User'] == '10001:10001', name
              assert image['Config']['Labels']['org.opencontainers.image.revision'] == '${{ github.sha }}', name
              current = image['RootFS']['Layers']
              assert current[:len(dependencies)] == dependencies, name
              if name.startswith('gene-worker:'):
                  assert current[:len(worker_dependencies)] == worker_dependencies, name
              layers.append(current)
          assert layers[0] != layers[2], 'probe did not rebuild the source layer'
          assert layers[1] != layers[3], 'probe did not rebuild the worker source layer'
          print('Source-only rebuilds share production and worker dependency layers')
          PY
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install uv==0.11.30
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --frozen --extra red
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python scripts/build_audio_plugin.py
      - run: docker build -f ops/Dockerfile.audio --target node -t gene-audio:check .
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --memory 256m --cpus 1
          --tmpfs /tmp:rw,nosuid,nodev,exec,size=64m
          --entrypoint java gene-audio:check -Xmx64m
          -cp '/probe/classes:/probe/lib/*' UdpTimingProbe
