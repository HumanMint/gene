name: checks
# Private repos get a monthly allowance of Actions minutes: test each change once (a pull request, then its
# merge to main), skip docs-only changes, and let a newer push to the same pull request cancel the older run.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install uv==0.11.30
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --frozen --extra red
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python scripts/build_audio_plugin.py
      - run: docker build -f ops/Dockerfile.audio --target node -t gene-audio:check .
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --memory 256m --cpus 1
          --tmpfs /tmp:rw,nosuid,nodev,exec,size=64m
          --entrypoint java gene-audio:check -Xmx64m
          -cp '/probe/classes:/probe/lib/*' UdpTimingProbe
