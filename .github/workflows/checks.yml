name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install uv==0.11.30
      - run: uv sync --frozen --extra red
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python scripts/build_audio_plugin.py
      - run: docker build -f ops/Dockerfile.audio --target node -t gene-audio:check .
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --memory 256m --cpus 1
          --tmpfs /tmp:rw,nosuid,nodev,exec,size=64m
          --entrypoint java gene-audio:check -Xmx64m
          -cp '/probe/classes:/probe/lib/*' UdpTimingProbe
