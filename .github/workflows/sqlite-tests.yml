name: sqlite tests
on:
  push:
    branches: [main]
  pull_request:
    paths:
      # Broad filters keep storage callers and regression tests covered without a fragile file list.
      - 'src/gene/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/sqlite-tests.yml'
  workflow_dispatch:
    inputs:
      fri_ref:
        description: Fri ref (unused by this Gene-only job)
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: sqlite-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    container: python:3.11-bookworm
    timeout-minutes: 30
    env:
      # Keep uv on the container interpreter that supplies production's SQLite version.
      UV_PYTHON: /usr/local/bin/python
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Assert production SQLite series
        run: |
          python -c 'import sqlite3; print(sqlite3.sqlite_version)' | tee /tmp/sqlite-version
          grep -q '^3\.40\.' /tmp/sqlite-version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install uv==0.11.30
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: sqlite-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: sqlite-uv-${{ runner.os }}-
      - run: uv sync --frozen --extra red
      - run: uv run pytest -q
